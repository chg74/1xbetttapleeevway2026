<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Apple of Fortune</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh;overflow-x:hidden;user-select:none}

.loading-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:transparent}
.loading-screen.hidden{display:none}
.spinner{width:50px;height:50px;border:4px solid rgba(74,144,226,.3);border-top-color:#4a90e2;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}

#appleScreen{position:fixed;inset:0;z-index:150;display:none;background:url('https://raw.githubusercontent.com/turbo1-2/my-images/refs/heads/main/ab488ed6-75a0-4fc5-899c-d1b16caadb06.jpeg') center/cover no-repeat}
#appleScreen.active{display:flex}
.apple-inner{width:100%;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(0,20,10,.45) 0%,rgba(0,20,10,.15) 40%,rgba(0,20,10,.65) 100%);position:relative;overflow:hidden}

/* ⭐ الشريط العلوي */
.apple-top{
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(6px);
    min-height:50px;
}
.top-left-icons{display:flex;align-items:center;gap:12px}
.top-left-icons button{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0}
.top-center-balance{display:flex;align-items:center;gap:6px;direction:ltr}
.top-center-balance .bal-val{color:#fff;font-size:15px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.top-center-balance .plus-btn{width:28px;height:28px;background:#2eb863;color:#fff;border:none;border-radius:50%;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px rgba(46,204,113,.5)}
.top-right-icons{display:flex;align-items:center;gap:10px}
.top-right-icons button{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0}

/* ⭐ عنوان اللعبة */
.apple-title{
    color:#fff;font-size:14px;font-weight:800;letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,.9);text-align:center;
    padding:6px 0 2px;flex-shrink:0;
}

/* ⭐ منطقة اللعب */
.apple-main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:5px 10px 0 10px;
    min-height:0;
    overflow:hidden;
    position:relative;
}
.apple-grid-wrap{
    display:flex;
    flex-direction:row;
    gap:8px;
    height:100%;
    max-height:100%;
    align-items:center;
    justify-content:center;
    direction:ltr;
    width:100%;
    max-width:290px;
    padding:0;
    box-sizing:border-box;
}

/* ⭐ الشبكة (Grid) */
.apple-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(9,1fr);
    gap:0px;
    flex:1;
    height:100%;
    width:100%;
    direction:ltr;
    align-content:center;
}
.apple-cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
}
.apple-cell img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.apple-cell:nth-child(n+6) { margin-top: -6px; }
.apple-cell.clickable{cursor:pointer}
.apple-cell.clickable:active{transform:scale(.92);transition:transform .1s}

/* ⭐ عمود المضاعفات (الشكل النهائي زي الصورة) */
.apple-mults{
    display:grid;
    grid-template-rows:repeat(9,1fr);
    gap:6px;
    flex-shrink:0;
    padding:0;
    align-items:center;
    width:48px;
    height:100%;
    direction:ltr;
    align-content:center;
}

.apple-mult{
    display:flex;
    align-items:center;
    justify-content:center;
    /* ⭐ الصورة اللي بعتها كخلفية مع شكل الكبسولة */
    background-image: url('https://i.postimg.cc/C5Y8LkHT/Picsart-26-10-06-19-06-22-804.png');
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    background-color: transparent;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    border-radius: 50px; /* الشكل البيضاوي الكامل */
    height: 100%;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    white-space: nowrap;
    padding: 0 4px;
    position: relative;
    overflow: hidden;
    border: none;
    box-shadow: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}

.apple-mult:nth-child(n+2) { margin-top: 0; }

/* ⭐ إخفاء الأرقام تماماً في البداية */
.apple-mult .txt{
    opacity: 0;
    transition: opacity 0.4s ease;
    direction: ltr;
}

/* ⭐ إظهار الأرقام بعد بدء الرهان */
.apple-mults.show .apple-mult .txt{
    opacity: 1;
}

/* ⭐ الخانة الحالية (المضيئة) */
.apple-mult.current{
    background: linear-gradient(180deg, #8bc34a, #689f38);
    box-shadow: 0 2px 10px rgba(139,195,74,.85);
    transform: scale(1.05);
    z-index: 10;
}

/* ⭐ الجزء السفلي (Controls) */
.apple-bottom{padding:0 14px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}

/* صف الأزرار MIN X2 X/2 MAX */
.apple-ctrl-row{display:flex;gap:6px;direction:ltr;}
.apple-ctrl-row button{
    flex:1;
    background:linear-gradient(180deg,#4a90e2,#3b7fd1);
    color:#fff;border:none;padding:10px 4px;
    border-radius:22px;font-weight:800;font-size:13px;
    cursor:pointer;transition:.2s;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.apple-ctrl-row button:active{transform:scale(.95)}
.apple-ctrl-row button:disabled{opacity:.4}

/* ⭐ صف الرهان */
.apple-stake-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:rgba(20,35,60,.85);
    border-radius:14px;
    padding:8px 12px;
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 15px rgba(0,0,0,.3);
    direction:ltr;
}

.stake-input-group{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
}

.apple-stake-input{
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(255,255,255,.25);
    color:#fff;
    font-size:22px;
    font-weight:800;
    padding:2px 0 2px;
    outline:none;
    direction:ltr;
    font-family:inherit;
    width:100%;
    text-align:left;
}
.apple-stake-input:disabled{opacity:.6}
.apple-stake-input::-webkit-outer-spin-button,.apple-stake-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.stake-limits{
    font-size:11px;
    color:#8fa0b5;
    margin-top:2px;
    text-align:left;
    direction:ltr;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.apple-action-btn{
    background:linear-gradient(180deg,#4a90e2,#3b7fd1);
    color:#fff;
    border:none;
    border-radius:20px;
    padding:12px 22px;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 4px 12px rgba(74,144,226,.4);
    flex-shrink:0;
}
.apple-action-btn:active{transform:scale(.96)}
.apple-action-btn:disabled{opacity:.6}

/* ⭐ شريط الأرباح */
.apple-winnings-bar{background:rgba(0,0,0,.6);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:10px;border-radius:8px;margin-bottom:8px;display:none;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.08)}
.apple-winnings-bar.show{display:block}
.apple-winnings-bar .val{color:#8bc34a;font-weight:900;font-size:16px}

.apple-full-cashout{display:none;margin-top:8px}
.apple-full-cashout.show{display:block}
.apple-full-cashout button{width:100%;background:linear-gradient(180deg,#4a90e2,#3b7fd1);color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}

.apple-gameover-row{display:none;flex-direction:column;gap:8px;margin-top:8px}
.apple-gameover-row.show{display:flex}
.play-again-btn{background:linear-gradient(180deg,#4a90e2,#3b7fd1);color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer}
.new-bet-btn{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);padding:12px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}

/* ⭐ شاشة النتيجة */
.apple-result-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:200;pointer-events:none;background:transparent}
.apple-result-overlay.show{display:flex}
.result-content{text-align:center;padding:20px}
.result-title{font-size:52px;font-weight:900;color:#8bc34a;text-shadow:0 4px 22px rgba(0,0,0,.9),0 0 15px #000;margin-bottom:6px;animation:resultPop .4s cubic-bezier(.2,.9,.3,1.4)}
.result-title.lose{font-size:26px;color:#eaffea;text-shadow:0 4px 22px rgba(0,0,0,.9),0 0 15px #000;line-height:1.5;font-weight:900;max-width:340px;margin:0 auto 10px}
.result-msg{font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 8px #000;margin-top:4px}
.result-msg .amt{color:#fff;font-weight:900;font-size:22px}
@keyframes resultPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body oncontextmenu="return false">

<div id="loadingScreen" class="loading-screen">
    <div class="spinner"></div>
</div>

<div id="appleScreen">
    <div class="apple-inner">
        <div class="apple-top">
            <div class="top-left-icons">
                <button>←</button>
            </div>
            <div class="top-center-balance">
                <span class="bal-val" id="appleBalance">140.07</span> <span class="cur" style="font-size:10px;opacity:.8">ج.م</span>
                <button class="plus-btn" onclick="addFunds()">+</button>
            </div>
            <div class="top-right-icons">
                <button>ℹ️</button>
            </div>
        </div>

        <div class="apple-title">APPLE OF FORTUNE</div>

        <div class="apple-main">
            <div class="apple-grid-wrap">
                <div class="apple-mults" id="appleMults"></div>
                <div class="apple-grid" id="appleGrid"></div>
            </div>
            <div class="apple-result-overlay" id="appleResultOverlay">
                <div class="result-content">
                    <div class="result-title" id="resultTitle">فوز</div>
                    <div class="result-msg" id="resultMsg">لقد ربحت <span class="amt">0</span> ج.م</div>
                </div>
            </div>
        </div>

        <div class="apple-bottom">
            <div class="apple-ctrl-row" id="appleCtrlRow">
                <button id="ctrlMin" onclick="appleCtrl('min')">MIN</button>
                <button id="ctrlDouble" onclick="appleCtrl('double')">X2</button>
                <button id="ctrlHalf" onclick="appleCtrl('half')">X/2</button>
                <button id="ctrlMax" onclick="appleCtrl('max')">MAX</button>
            </div>

            <div class="apple-winnings-bar" id="appleWinningsBar">
                الأرباح الحالية: <span class="val" id="currentWinnings">0.00</span> ج.م
            </div>

            <div class="apple-stake-row" id="appleStakeRow">
                <div class="stake-input-group">
                    <input class="apple-stake-input" id="appleStakeVal" type="number" value="10" min="10" inputmode="numeric">
                    <div class="stake-limits" id="stakeLimitsText">min 10 ج.م - max 74295.33 ج.م</div>
                </div>
                <button class="apple-action-btn" id="appleActionBtn" onclick="appleAction()">STAKE</button>
            </div>

            <div class="apple-full-cashout" id="appleFullCashout">
                <button onclick="appleAction()">خذ الأرباح</button>
            </div>

            <div class="apple-gameover-row" id="appleGameoverRow">
                <button class="play-again-btn" id="playAgainBtn" onclick="playAgain()">العب مرة أخرى (10 ج.م)</button>
                <button class="new-bet-btn" onclick="newBet()">رهان جديد</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase, ref, set} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAUc2C9hG9VE7RECiW19QXjNZqVH96sFE",
    authDomain: "zezo-59a8d.firebaseapp.com",
    databaseURL: "https://zezo-59a8d-default-rtdb.firebaseio.com",
    projectId: "zezo-59a8d",
    storageBucket: "zezo-59a8d.firebasestorage.app",
    messagingSenderId: "49183098248",
    appId: "1:49183098248:web:37e3fb16744042a1bb263d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let _bal = 140.07;

function _updUI(){
    const a = document.getElementById('appleBalance');
    if(a) a.textContent = Number(_bal||0).toFixed(2);

    const limitsEl = document.getElementById('stakeLimitsText');
    if(limitsEl){
        limitsEl.textContent = `min 10 ج.م - max ${_bal.toFixed(2)} ج.م`;
    }
}
function _setBal(v){ _bal = Number(v||0); _updUI(); }

const APPLE_MULTS = [1.23, 1.54, 1.93, 2.41, 4.02, 6.71, 11.18, 27.97, 69.93];
const APPLE_ROWS = 9;
const APPLE_COLS = 5;

const IMG_ROW0        = 'https://raw.githubusercontent.com/turbo1-2/my-images/refs/heads/main/efc0e4cb-1559-4172-8df1-389128bf9fa7.png';
const IMG_TRANSPARENT = 'https://raw.githubusercontent.com/turbo1-2/my-images/refs/heads/main/new_version_2.png';
const IMG_TOP         = 'https://raw.githubusercontent.com/turbo1-2/my-images/refs/heads/main/new_version_5.png';
const IMG_SAFE        = 'https://raw.githubusercontent.com/turbo1-2/my-images/refs/heads/main/new_version_3.png';
const IMG_ROTTEN      = 'https://raw.githubusercontent.com/turbo1-2/my-images/refs/heads/main/new_version_1.png';
const IMG_PRESSED     = 'https://raw.githubusercontent.com/turbo1-2/my-images/refs/heads/main/2cbd9a5d-eb26-4355-b07d-635a56cbe6cb.png';

let appleState = {
    active:false, finished:false, revealAll:false,
    stake:10, stakePlaced:false, currentRow:0,
    picks:{}, rottenAt:[], cashoutMult:1.23, wonAmount:0,
    pressedCell:null
};

function _saveApplePrediction(rottenAt){
    try{
        set(ref(db,'applePrediction/current'), {
            rottenAt: rottenAt,
            timestamp: Date.now(),
            rows: APPLE_ROWS,
            cols: APPLE_COLS
        })
        .then(()=>{ console.log('[Firebase] Prediction saved:', rottenAt); })
        .catch((err)=>{ console.error('[Firebase] Save error:', err); });
    }catch(e){ console.error(e); }
}

function openApple(){
    appleState.active = true;
    appleState.finished = false;
    appleState.revealAll = false;
    appleState.stakePlaced = false;
    appleState.currentRow = 0;
    appleState.picks = {};
    appleState.rottenAt = [];
    appleState.cashoutMult = 1.23;
    appleState.stake = 10;
    appleState.wonAmount = 0;
    appleState.pressedCell = null;

    const stkInp = document.getElementById('appleStakeVal');
    stkInp.value = '10';
    stkInp.disabled = false;

    _updUI();
    document.getElementById('appleMults').classList.remove('show');
    document.getElementById('appleWinningsBar').classList.remove('show');
    document.getElementById('appleFullCashout').classList.remove('show');
    document.getElementById('appleResultOverlay').classList.remove('show');
    document.getElementById('appleGameoverRow').classList.remove('show');
    document.getElementById('appleStakeRow').style.display = 'flex';
    document.getElementById('appleCtrlRow').style.display = 'flex';

    ['ctrlMax','ctrlHalf','ctrlDouble','ctrlMin'].forEach(id=>{
        const el = document.getElementById(id); if(el) el.disabled = false;
    });

    renderApple();
    updateAppleActionBtn();
    document.getElementById('appleScreen').classList.add('active');
}

function getCellImage(gameRow, col){
    if(appleState.revealAll){
        return (appleState.rottenAt[gameRow] === col) ? IMG_ROTTEN : IMG_SAFE;
    }
    if(appleState.pressedCell &&
       appleState.pressedCell.row === gameRow &&
       appleState.pressedCell.col === col){
        return IMG_PRESSED;
    }
    const pickedCol = appleState.picks[gameRow];
    const isRotten = appleState.rottenAt[gameRow] === pickedCol;

    if(pickedCol !== undefined){
        if(col === pickedCol) return isRotten ? IMG_ROTTEN : IMG_SAFE;
        return IMG_TRANSPARENT;
    }
    if(!appleState.stakePlaced){
        if(gameRow === 0) return IMG_ROW0;
        if(gameRow >= 1 && gameRow <= 4) return IMG_TRANSPARENT;
        if(gameRow >= 5) return IMG_TOP;
    }
    if(gameRow === appleState.currentRow && !appleState.finished){
        return IMG_ROW0;
    }
    if(gameRow < appleState.currentRow) return IMG_TRANSPARENT;
    if(gameRow >= 5) return IMG_TOP;
    if(gameRow >= 1 && gameRow <= 4) return IMG_TRANSPARENT;
    return IMG_ROW0;
}

function renderApple(){
    const grid = document.getElementById('appleGrid');
    grid.innerHTML = '';

    for(let vr=0; vr<APPLE_ROWS; vr++){
        const gameRow = APPLE_ROWS - 1 - vr;
        for(let c=0; c<APPLE_COLS; c++){
            const cell = document.createElement('div');
            cell.className = 'apple-cell';
            cell.dataset.row = gameRow;
            cell.dataset.col = c;
            cell.innerHTML = `<img src="${getCellImage(gameRow, c)}" alt="">`;

            const canClick = appleState.active && !appleState.finished && appleState.stakePlaced
                && gameRow === appleState.currentRow && appleState.picks[gameRow] === undefined
                && !appleState.pressedCell;

            if(canClick){
                cell.classList.add('clickable');
                cell.onclick = () => appleClick(gameRow, c);
            }
            grid.appendChild(cell);
        }
    }

    const mults = document.getElementById('appleMults');
    mults.innerHTML = '';
    for(let vr=0; vr<APPLE_ROWS; vr++){
        const gameRow = APPLE_ROWS - 1 - vr;
        const m = document.createElement('div');
        m.className = 'apple-mult';

        const val = APPLE_MULTS[gameRow];
        const label = val >= 100 ? `x${val.toFixed(0)}` : `x${val.toFixed(2)}`;
        m.innerHTML = `<span class="txt">${label}</span>`;

        if(gameRow === appleState.currentRow && !appleState.finished && appleState.stakePlaced){
            m.classList.add('current');
        }
        mults.appendChild(m);
    }
}

function appleClick(gameRow, col){
    if(!appleState.active || appleState.finished) return;
    if(!appleState.stakePlaced) return;
    if(gameRow !== appleState.currentRow) return;
    if(appleState.picks[gameRow] !== undefined) return;
    if(appleState.pressedCell) return;

    appleState.pressedCell = {row: gameRow, col: col};
    renderApple();

    setTimeout(()=>{
        appleState.pressedCell = null;
        appleState.picks[gameRow] = col;
        const isRotten = appleState.rottenAt[gameRow] === col;
        renderApple();

        if(isRotten){
            setTimeout(()=>{
                appleState.finished = true;
                appleState.cashoutMult = 0;
                appleState.revealAll = true;
                renderApple();
                document.getElementById('appleWinningsBar').classList.remove('show');
                document.getElementById('appleFullCashout').classList.remove('show');
                showResultOverlay(false, 0);
                showGameoverButtons(false);
            }, 400);
            return;
        }

        document.getElementById('appleFullCashout').classList.add('show');
        updateWinningsBar();

        if(gameRow === APPLE_ROWS - 1){
            setTimeout(()=>{
                appleState.finished = true;
                appleState.cashoutMult = APPLE_MULTS[APPLE_ROWS - 1];
                const win = appleState.stake * appleState.cashoutMult;
                _setBal(_bal + win);
                appleState.revealAll = true;
                appleState.wonAmount = win;
                renderApple();
                document.getElementById('appleWinningsBar').classList.remove('show');
                document.getElementById('appleFullCashout').classList.remove('show');
                showResultOverlay(true, win);
                showGameoverButtons(true);
            }, 400);
            return;
        }

        setTimeout(()=>{
            appleState.currentRow = gameRow + 1;
            appleState.cashoutMult = APPLE_MULTS[gameRow + 1];
            renderApple();
            updateWinningsBar();
        }, 400);

    }, 200);
}

function showResultOverlay(isWin, win){
    const ov = document.getElementById('appleResultOverlay');
    if(isWin){
        document.getElementById('resultTitle').textContent = 'فوز';
        document.getElementById('resultTitle').className = 'result-title';
        document.getElementById('resultMsg').innerHTML = `لقد ربحت <span class="amt">${win.toFixed(1)}</span> ج.م`;
    }else{
        document.getElementById('resultTitle').textContent = 'حظ أوفر في المرة القادمة!';
        document.getElementById('resultTitle').className = 'result-title lose';
        document.getElementById('resultMsg').innerHTML = 'حاول مرة أخرى';
    }
    ov.classList.add('show');
}

function showGameoverButtons(won){
    document.getElementById('appleCtrlRow').style.display = 'none';
    document.getElementById('appleStakeRow').style.display = 'none';
    document.getElementById('appleWinningsBar').classList.remove('show');
    document.getElementById('appleFullCashout').classList.remove('show');

    const btn = document.getElementById('playAgainBtn');
    btn.textContent = `العب مرة أخرى (${appleState.stake} ج.م)`;
    document.getElementById('appleGameoverRow').classList.add('show');
}

function updateWinningsBar(){
    const bar = document.getElementById('appleWinningsBar');
    if(!appleState.stakePlaced || appleState.finished || Object.keys(appleState.picks).length === 0){
        bar.classList.remove('show');
        return;
    }
    const win = appleState.stake * appleState.cashoutMult;
    document.getElementById('currentWinnings').textContent = win.toFixed(2);
    bar.classList.add('show');
}

function updateAppleActionBtn(){
    const btn = document.getElementById('appleActionBtn');
    if(!btn) return;
    if(!appleState.stakePlaced || appleState.finished){
        btn.textContent = 'STAKE';
        btn.disabled = false;
    }
}

function appleAction(){
    if(!appleState.active) return;
    if(appleState.finished) return;

    if(!appleState.stakePlaced){
        const stkInp = document.getElementById('appleStakeVal');
        const stakeVal = Number(stkInp.value) || 0;

        if(!stakeVal || stakeVal < 10){ return; }
        if(stakeVal > _bal){ return; }

        appleState.stake = stakeVal;
        _setBal(_bal - appleState.stake);

        appleState.stakePlaced = true;
        appleState.currentRow = 0;
        appleState.picks = {};
        appleState.rottenAt = [];

        for(let r=0; r<APPLE_ROWS; r++){
            appleState.rottenAt.push(Math.floor(Math.random() * APPLE_COLS));
        }

        _saveApplePrediction(appleState.rottenAt.slice());

        document.getElementById('appleMults').classList.add('show');

        stkInp.disabled = true;

        ['ctrlMax','ctrlHalf','ctrlDouble','ctrlMin'].forEach(id=>{
            const el = document.getElementById(id); if(el) el.disabled = true;
        });

        document.getElementById('appleCtrlRow').style.display = 'none';
        document.getElementById('appleStakeRow').style.display = 'none';
        document.getElementById('appleFullCashout').classList.remove('show');
        document.getElementById('appleWinningsBar').classList.remove('show');

        renderApple();
        return;
    }

    const win = appleState.stake * appleState.cashoutMult;
    _setBal(_bal + win);

    appleState.finished = true;
    appleState.revealAll = true;
    appleState.wonAmount = win;
    renderApple();

    document.getElementById('appleWinningsBar').classList.remove('show');
    document.getElementById('appleFullCashout').classList.remove('show');
    showResultOverlay(true, win);
    showGameoverButtons(true);
}

function playAgain(){
    if(!appleState.active) return;
    const sameStake = appleState.stake;
    if(sameStake > _bal){ return; }

    document.getElementById('appleGameoverRow').classList.remove('show');
    document.getElementById('appleResultOverlay').classList.remove('show');
    document.getElementById('appleCtrlRow').style.display = 'none';
    document.getElementById('appleStakeRow').style.display = 'none';
    document.getElementById('appleFullCashout').classList.remove('show');
    document.getElementById('appleWinningsBar').classList.remove('show');

    appleState.finished = false;
    appleState.revealAll = false;
    appleState.stakePlaced = false;
    appleState.currentRow = 0;
    appleState.picks = {};
    appleState.rottenAt = [];
    appleState.cashoutMult = 1.23;
    appleState.wonAmount = 0;
    appleState.stake = sameStake;
    appleState.pressedCell = null;

    const stkInp = document.getElementById('appleStakeVal');
    stkInp.value = sameStake;
    stkInp.disabled = true;

    _setBal(_bal - sameStake);
    appleState.stakePlaced = true;

    for(let r=0; r<APPLE_ROWS; r++){
        appleState.rottenAt.push(Math.floor(Math.random() * APPLE_COLS));
    }

    _saveApplePrediction(appleState.rottenAt.slice());
    document.getElementById('appleMults').classList.add('show');
    renderApple();
}

function newBet(){
    if(!appleState.active) return;

    document.getElementById('appleGameoverRow').classList.remove('show');
    document.getElementById('appleResultOverlay').classList.remove('show');
    document.getElementById('appleFullCashout').classList.remove('show');
    document.getElementById('appleWinningsBar').classList.remove('show');
    document.getElementById('appleCtrlRow').style.display = 'flex';
    document.getElementById('appleStakeRow').style.display = 'flex';

    document.getElementById('appleMults').classList.remove('show');

    appleState.finished = false;
    appleState.revealAll = false;
    appleState.stakePlaced = false;
    appleState.currentRow = 0;
    appleState.picks = {};
    appleState.rottenAt = [];
    appleState.cashoutMult = 1.23;
    appleState.wonAmount = 0;
    appleState.pressedCell = null;

    const stkInp = document.getElementById('appleStakeVal');
    stkInp.disabled = false;
    if(!stkInp.value || Number(stkInp.value) < 10) stkInp.value = appleState.stake || 10;

    ['ctrlMax','ctrlHalf','ctrlDouble','ctrlMin'].forEach(id=>{
        const el = document.getElementById(id); if(el) el.disabled = false;
    });

    renderApple();
    updateAppleActionBtn();
}

function appleCtrl(mode){
    if(appleState.stakePlaced) return;
    const stkInp = document.getElementById('appleStakeVal');
    let stake = Number(stkInp.value) || 10;

    if(mode === 'min') stake = 10;
    else if(mode === 'double') stake = stake * 2;
    else if(mode === 'half') stake = Math.max(10, Math.floor(stake / 2));
    else if(mode === 'max') stake = Math.floor(_bal);

    if(stake < 10) stake = 10;
    if(stake > _bal) stake = Math.floor(_bal);

    stkInp.value = stake;
}

function addFunds(){ }

window.appleAction = appleAction;
window.appleCtrl = appleCtrl;
window.playAgain = playAgain;
window.newBet = newBet;
window.addFunds = addFunds;

document.addEventListener('DOMContentLoaded', ()=>{
    setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hidden');
        openApple();
    }, 1500);

    const stkInp = document.getElementById('appleStakeVal');
    if(stkInp){
        stkInp.addEventListener('blur', ()=>{
            let v = Number(stkInp.value);
            if(!v || v < 10) stkInp.value = 10;
            if(v > _bal && _bal >= 10) stkInp.value = Math.floor(_bal);
        });
    }
});
</script>
</body>
</html>
